# Скопируйте в inventory.yml и впишите свои ноды.
all:
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
    # Адрес хаба в WireGuard-сети — сюда ноды шлют iperf3
    hub_private_ip: "10.77.0.1"

  children:
    nodes:
      hosts:
        # Имя хоста должно совпадать с именем конфига в ansible/files/wg/
        nl-1:
          ansible_host: 203.0.113.11
          link_mbit: 1000
        de-1:
          ansible_host: 203.0.113.12
          link_mbit: 1000
