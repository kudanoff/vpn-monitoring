# Раскатка агента на ноды. Идемпотентна: гонять можно сколько угодно раз.
#   ansible-playbook -i inventory.yml playbook.yml
#   ansible-playbook -i inventory.yml playbook.yml --limit nl-3   # одна нода
- name: Агент мониторинга на нодах Remnawave
  hosts: nodes
  become: true
  roles:
    - common
    - wireguard
    - node_exporter
    - speedtest
