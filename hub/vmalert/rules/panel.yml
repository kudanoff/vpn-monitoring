groups:

# ─────────────────────────────────────────────────────────────────────────
# Метрики, которые панель собирает с нод сама.
#
# Их достаточно, чтобы запуститься не трогая ноды вообще. Единственное, чего
# они принципиально не могут: сказать, жив ли сервер, когда связь с панелью
# порвалась — метрики приходят через ту же связь и просто исчезают вместе
# с ней. За этим — node_exporter, второй этап.
# ─────────────────────────────────────────────────────────────────────────
- name: panel_derived
  interval: 30s
  rules:

  # Панель знает ноды только по UUID. Имя берём из basic_info — так список
  # нод не нужно вести руками: появилась нода в панели, появилась в боте.
  - record: node:name_map
    expr: |
      max by(project, node_uuid, node, node_country_emoji, provider_name) (
        label_replace(remnawave_node_basic_info, "node", "$1", "node_name", "(.+)")
      )

  - record: node:panel_status
    expr: max by(project, node) (remnawave_node_status * on(project, node_uuid) group_left(node) node:name_map)

  - record: node:panel_users
    expr: max by(project, node) (remnawave_node_online_users * on(project, node_uuid) group_left(node) node:name_map)

  - record: node:panel_uptime
    expr: max by(project, node) (remnawave_node_uptime_seconds * on(project, node_uuid) group_left(node) node:name_map)

  # Загрузка процессора: load average, поделённый на число ядер.
  # Это не то же самое, что busy% у node_exporter, но для "нода задыхается"
  # показатель даже честнее — учитывает очередь на ввод-вывод.
  - record: node:panel_cpu
    expr: |
      max by(project, node) (
        (
          max by(project, node_uuid) ({__name__=~"remnawave_node_cpu_load_avg_1.*"})
            / on(project, node_uuid) group_left() max by(project, node_uuid) (remnawave_node_cpu_count)
        ) * on(project, node_uuid) group_left(node) node:name_map
      )

  - record: node:panel_mem
    expr: |
      max by(project, node) (
        (
          1 - remnawave_node_memory_free_bytes / on(project, node_uuid) group_left()
              remnawave_node_memory_total_bytes
        ) * on(project, node_uuid) group_left(node) node:name_map
      )

  - record: node:panel_rx
    expr: max by(project, node) (remnawave_node_network_rx_bytes_per_sec * 8 * on(project, node_uuid) group_left(node) node:name_map)

  - record: node:panel_tx
    expr: max by(project, node) (remnawave_node_network_tx_bytes_per_sec * 8 * on(project, node_uuid) group_left(node) node:name_map)

  # p95 за сутки — цифра, по которой хостеры считают деньги и по которой
  # видно реальный потолок канала, а не среднее.
  - record: node:panel_tx_p95_24h
    expr: quantile_over_time(0.95, node:panel_tx[24h:5m])


# ─────────────────────────────────────────────────────────────────────────
# Алерты первого этапа: работают только на метриках панели
# ─────────────────────────────────────────────────────────────────────────
- name: panel_alerts
  interval: 30s
  rules:

  # keep_firing_for у нагрузки — гистерезис: процессор, который ходит вокруг
  # порога, иначе даёт «сработал» и через минуту «отбой», и так по кругу.
  # Отбой приходит, только когда нагрузка 15 минут держится ниже порога.

  - alert: PanelHighCPU
    expr: node:panel_cpu > 0.90
    for: 15m
    keep_firing_for: 15m
    labels: {severity: warning}
    annotations:
      summary: "🔥 [{{ $labels.project }}] {{ $labels.node }} — процессор загружен на {{ $value | humanizePercentage }}"

  - alert: PanelHighMemory
    expr: node:panel_mem > 0.92
    for: 15m
    keep_firing_for: 15m
    labels: {severity: warning}
    annotations:
      summary: "🧠 [{{ $labels.project }}] {{ $labels.node }} — память занята на {{ $value | humanizePercentage }}"

  # Одна перезагрузка — не повод писать: сервер сам поднялся и работает.
  # А вот две за сутки — признак, что с ним что-то не так. Считаем сбросы
  # аптайма; нули отбрасываем, иначе за перезагрузку сошёл бы любой обрыв
  # связи, если панель на это время рисует аптайм нулём.
  - alert: NodeRebootsFrequently
    expr: resets((node:panel_uptime > 0)[24h:1m]) >= 2
    labels:
      severity: warning
      notify: once
      action: "смотреть журнал сервера и хостера: сам он так часто падать не должен"
    annotations:
      summary: "🔄 [{{ $labels.project }}] {{ $labels.node }} — перезагрузок за сутки: {{ $value | printf \"%.0f\" }}"

  # Основной алерт первого этапа: панель потеряла ноду и подтвердить,
  # что сервер при этом жив, некому — агента на ноде ещё нет. Пять минут —
  # запас на перезагрузку: если нода поднялась сама, писать не о чем.
  - alert: PanelNodeDisconnected
    expr: node:panel_status == 0 unless on(project, node) (up{job="node"} == 1)
    for: 5m
    labels:
      severity: critical
      action: "проверить ноду: контейнер, сеть, хостера"
    annotations:
      summary: "🔴 [{{ $labels.project }}] {{ $labels.node }} — панель потеряла связь с нодой"
      description: "Уже 5 минут. Если нода выведена из работы намеренно, выключите её в панели — алерты по ней прекратятся."

  # Связь рвётся и восстанавливается. Это опаснее ровно упавшей ноды:
  # пользователей выкидывает, а в панели в момент вашего взгляда всё хорошо.
  - alert: NodeFlapping
    expr: changes(node:panel_status[1h]) >= 4
    for: 5m
    labels:
      severity: warning
      action: "смотреть сеть и контейнер ноды, само не пройдёт"
    annotations:
      summary: "🔀 [{{ $labels.project }}] {{ $labels.node }} — связь рвалась {{ $value | printf \"%.0f\" }} раз за час"

  # Нода выключена в панели — значит выведена из работы намеренно. Сам алерт
  # в чат не идёт: Alertmanager глушит им все остальные алерты этой ноды.
  # Признак раз в минуту пишет бот, спрашивая панель. keep_firing_for даёт
  # включённой ноде время подняться и переподключиться, прежде чем по ней
  # снова пойдут тревоги.
  - alert: NodeDisabledInPanel
    expr: max by(project, node) (vpnmon_node_disabled) == 1
    keep_firing_for: 15m
    labels: {severity: silent}
    annotations:
      summary: "⏸ [{{ $labels.project }}] {{ $labels.node }} — выключена в панели, алерты по ней заглушены"

  # Панель перестала отдавать метрики по ноде вообще.
  - alert: PanelNodeMetricsMissing
    expr: absent_over_time(node:panel_status[10m]) == 1
    for: 5m
    labels: {severity: warning}
    annotations:
      summary: "❓ Панель перестала отдавать метрики по нодам"
