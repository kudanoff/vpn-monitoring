groups:

# ─────────────────────────────────────────────────────────────────────────
# Ресурсы: процессор, память, диск
# ─────────────────────────────────────────────────────────────────────────
- name: resources
  interval: 30s
  rules:

  - record: node:cpu_busy:ratio
    expr: 1 - avg by(node, instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))

  - record: node:mem_used:ratio
    expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)

  - alert: HighCPU
    expr: node:cpu_busy:ratio > 0.90
    for: 15m
    labels: {severity: warning}
    annotations:
      summary: "🔥 {{ $labels.node }} — CPU {{ $value | humanizePercentage }} более 15 минут"

  # Отдельная история: процессор "свободен", а всё тормозит, потому что
  # его отбирает сосед по гипервизору. На VPS это частая и незаметная беда.
  - alert: HighCPUSteal
    expr: avg by(node) (rate(node_cpu_seconds_total{mode="steal"}[10m])) > 0.10
    for: 20m
    labels:
      severity: warning
      action: "жаловаться хостеру или переезжать"
    annotations:
      summary: "🐌 {{ $labels.node }} — steal {{ $value | humanizePercentage }}, гипервизор душит"

  - alert: HighMemory
    expr: node:mem_used:ratio > 0.92
    for: 15m
    labels: {severity: warning}
    annotations:
      summary: "🧠 {{ $labels.node }} — память занята на {{ $value | humanizePercentage }}"

  - alert: DiskFillingUp
    expr: |
      node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
        / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.10
    for: 30m
    labels: {severity: warning}
    annotations:
      summary: "💾 {{ $labels.node }} — на {{ $labels.mountpoint }} осталось {{ $value | humanizePercentage }}"

  # Прогноз: место кончится в ближайшие сутки. Ловит разросшиеся логи xray
  # до того, как они уронят ноду.
  - alert: DiskWillFillIn24h
    expr: |
      predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24*3600) < 0
        and node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.30
    for: 1h
    labels: {severity: warning}
    annotations:
      summary: "📉 {{ $labels.node }} — диск {{ $labels.mountpoint }} кончится за сутки"
