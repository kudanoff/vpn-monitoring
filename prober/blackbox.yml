# Конфиг пробника. Держится отдельно от hub/blackbox намеренно:
# пробник ставится на другую машину и не должен зависеть от соседних каталогов.
modules:
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
