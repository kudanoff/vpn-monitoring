# Нужен только для второго этапа — проверок доступности и агента на нодах.
# На первом этапе (метрики панели) файл можно оставить пустым: список нод
# панель отдаёт сама.
#
# Единственный файл, который вы правите при добавлении ноды.
# vmagent перечитывает его сам раз в 30 секунд — перезапуск не нужен.
#
#   targets    — адрес node_exporter в WireGuard-сети (10.77.0.x:9100)
#   node       — имя РОВНО как в панели Remnawave. По нему метрики панели
#                связываются с метриками железа, регистр и пробелы важны.
#   public_ip  — белый IP, по нему идут проверки доступности из NL и РФ
#   xray_port  — порт, на котором слушает xray (для TCP-проверки)
#   link_mbit  — заявленная хостером скорость порта, Мбит/с
#   hoster     — чтобы в алерте сразу было видно, кому писать тикет

# Пустой список: первый этап работает на метриках панели.
# Скобки обязательны — файл без них не парсится как список целей.
[]

# Пример заполнения для второго этапа:
#
# - targets: ["10.77.0.11:9100"]
#   labels:
#     node: "ltch"
#     public_ip: "203.0.113.11"
#     xray_port: "443"
#     link_mbit: "1000"
#     hoster: "cherry"
