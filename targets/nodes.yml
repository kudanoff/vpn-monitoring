# Единственный файл, который вы правите при добавлении ноды.
# vmagent перечитывает его сам раз в 30 секунд — перезапуск не нужен.
#
#   targets    — адрес node_exporter в WireGuard-сети (10.77.0.x:9100)
#   node       — имя, как в панели Remnawave (используется для связки метрик)
#   public_ip  — белый IP, по нему идут проверки доступности из NL и РФ
#   xray_port  — порт, на котором слушает xray (для TCP-проверки)
#   link_mbit  — заявленная хостером скорость порта, Мбит/с
#   hoster     — чтобы в алерте сразу было видно, кому писать тикет

- targets: ["10.77.0.11:9100"]
  labels:
    node: "nl-1"
    public_ip: "203.0.113.11"
    xray_port: "443"
    link_mbit: "1000"
    hoster: "worldstream"

- targets: ["10.77.0.12:9100"]
  labels:
    node: "de-1"
    public_ip: "203.0.113.12"
    xray_port: "443"
    link_mbit: "1000"
    hoster: "hetzner"
