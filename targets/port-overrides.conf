# Порт xray по нодам, если он отличается от DEFAULT_XRAY_PORT.
# Формат: имя ноды из панели = значение, где значение это
#   порт           — проверять этот порт на белом IP ноды
#   хост:порт      — проверять другой адрес: так проверяют ноды за CDN,
#                    по тому адресу, куда реально подключаются клиенты
#   skip           — не проверять порт вовсе
#
# Панель не отдаёт порт инбаунда в списке нод — он живёт в профиле
# конфигурации. Поэтому здесь.
#
# Примеры:
#   ltch = 8443
#   LTE_ruaz-nd-ya = api13.apicontai.ru:443
#   LTE_ruaz-nd-bl = skip
